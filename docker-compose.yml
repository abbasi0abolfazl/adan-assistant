services:
  api:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - runtime-data:/app/runtime
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    init: true
    stop_grace_period: 15s
  tests:
    profiles:
      - test
    build:
      context: .
      target: test
    network_mode: none
volumes:
  runtime-data:
